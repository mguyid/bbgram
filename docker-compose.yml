# Deployed with Coolify. Coolify fills every ${SERVICE_*} value itself:
#   SERVICE_URL_<NAME>_<PORT>  public URL of a service (from the domain set in Coolify → Domains),
#                              and the container port its proxy routes to
#   SERVICE_USER_* / SERVICE_PASSWORD_64_*  random credentials, generated once and kept across redeploys
# The only values to set by hand in Coolify are NEXT_PUBLIC_REOWN_PROJECT_ID (and DEV_MODE if ever needed).
# API_PUBLIC_URL, MINIAPP_URL and ADMIN_URL (api + worker) default to the staging domains; set them in Coolify to
# override. The SERVICE_URL_* values come through empty in those containers, so they are not used there.
# No `ports:` — Coolify's proxy routes traffic by domain.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: babygrand
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d babygrand"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      SERVICE_URL_API_8000: /
      DATABASE_URL: postgresql+asyncpg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/babygrand
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      DEV_MODE: ${DEV_MODE:-false}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      MINIAPP_URL: ${MINIAPP_URL:-https://miniapp-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      ADMIN_URL: ${ADMIN_URL:-https://admin-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      CORS_ORIGINS: ${MINIAPP_URL:-https://miniapp-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz},${ADMIN_URL:-https://admin-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./api
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/babygrand
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      DEV_MODE: ${DEV_MODE:-false}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      MINIAPP_URL: ${MINIAPP_URL:-https://miniapp-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      ADMIN_URL: ${ADMIN_URL:-https://admin-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
      CORS_ORIGINS: ${MINIAPP_URL:-https://miniapp-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz},${ADMIN_URL:-https://admin-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
    depends_on:
      api: { condition: service_started }

  miniapp:
    build:
      context: ./miniapp
      args:
        NEXT_PUBLIC_API_URL: ${SERVICE_URL_API_8000}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID}
    restart: unless-stopped
    environment:
      SERVICE_URL_MINIAPP_3000: /

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${SERVICE_URL_API_8000}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID}
    restart: unless-stopped
    environment:
      SERVICE_URL_ADMIN_3001: /

volumes:
  pgdata:
