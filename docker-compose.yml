# Deployed with Coolify.
#
# The only values you ever set by hand (Coolify → Environment Variables), once per environment:
#   API_URL, MINIAPP_URL, ADMIN_URL   public https URLs of the three apps (defaults below are staging)
#   NEXT_PUBLIC_REOWN_PROJECT_ID      WalletConnect project id
#   DEV_MODE                          optional, false by default
# CORS is derived from MINIAPP_URL and ADMIN_URL by the API; nothing else to keep in sync.
#   POSTGRES_PASSWORD, JWT_SECRET     required: the deploy fails if either is missing. Never change JWT_SECRET
#                                     after launch: it encrypts stored secrets.
#   POSTGRES_USER, POSTGRES_DB        optional, both default to babygrand
# The SERVICE_URL_<NAME>_<PORT>: / lines only tell Coolify's proxy which container port to route to.
# No `ports:` — Coolify's proxy routes traffic by domain.

x-backend-env: &backend-env
  # The API builds DATABASE_URL from these (URL-encoding the password).
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-babygrand}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:-babygrand}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?}
  DEV_MODE: ${DEV_MODE:-false}
  API_PUBLIC_URL: ${API_URL:-https://api-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
  MINIAPP_URL: ${MINIAPP_URL:-https://miniapp-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
  ADMIN_URL: ${ADMIN_URL:-https://admin-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}

x-frontend-args: &frontend-args
  NEXT_PUBLIC_API_URL: ${API_URL:-https://api-qm0jxwdghtdbt3ocbzlcu57f.metablockstaging.xyz}
  NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-babygrand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-babygrand}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment:
      <<: *backend-env
      SERVICE_URL_API_8000: /
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./api
    restart: unless-stopped
    command: python -m app.worker
    environment:
      <<: *backend-env
    depends_on:
      api: { condition: service_started }

  miniapp:
    build:
      context: ./miniapp
      args: *frontend-args
    restart: unless-stopped
    environment:
      SERVICE_URL_MINIAPP_3000: /

  admin:
    build:
      context: ./admin
      args: *frontend-args
    restart: unless-stopped
    environment:
      SERVICE_URL_ADMIN_3001: /

volumes:
  pgdata:
