[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./test/vectors.json" }]

[fuzz]
runs = 512

[fmt]
line_length = 120
ignore = ["lib/**"]

[rpc_endpoints]
bsc_testnet = "${BSC_RPC_URL}"

[lint]
exclude_lints = ["block-timestamp", "missing-events-access-control", "missing-events-arithmetic"]
